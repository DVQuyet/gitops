apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        canary-retry: "v3-bad"
    spec:
      containers:
        - name: api
          image: w9-api:1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: ERROR_RATE
              value: "1"
            - name: VERSION
              value: "v3"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
  strategy:
    canary:
      steps:
        - setWeight: 25
        - analysis:
            templates:
              - templateName: api-success-rate
        - setWeight: 50
        - analysis:
            templates:
              - templateName: api-success-rate
        - setWeight: 75
        - analysis:
            templates:
              - templateName: api-success-rate
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 9090
      targetPort: http
  type: ClusterIP
